[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "numbra-ml"
version = "0.1.0"
description = "Synthetic-only PLACEHOLDER data interfaces for Numbra"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = ["numpy==2.2.6", "Pillow==11.3.0", "jsonschema==4.25.1"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers --basetemp=tests/.tmp"
